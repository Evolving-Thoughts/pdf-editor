name: MVP QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mvp-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install PyMuPDF==1.28.2 openpyxl==3.1.5 odfpy==1.4.1
      - run: npm run qa:ci
      - name: Independent PDF reader checks
        run: |
          python scripts/verify-protected-export.py qa-artifacts/search-import-smoke | tee qa-artifacts/independent-protected.log
          python scripts/verify-table-export.py qa-artifacts/table-smoke | tee qa-artifacts/independent-table.log
      - name: Keep test logs (no source PDFs or exported forms)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-qa-logs
          path: |
            qa-artifacts/*.log
            qa-artifacts/results.json
            qa-artifacts/results.md
          if-no-files-found: warn
